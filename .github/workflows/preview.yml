name: Deploy Preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-preview
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ vars.DEPLOY_URL }}
    env:
      DEPLOY_ENV: preview
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run web:build
      - run: npm run deploy:config
      - name: Apply D1 migrations (automatic backup)
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler-deploy.json
      - run: npx wrangler deploy --config .wrangler-deploy.json
      - run: npm run deploy:smoke
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
