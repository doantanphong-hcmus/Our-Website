name: Deploy Production

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run web:build
      - run: npm test
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
      - run: npm audit --audit-level=high
      - run: npm run cicd:check

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    env:
      DEPLOY_ENV: production
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run web:build
      - run: npm run deploy:config
      - name: Apply D1 migrations (automatic backup)
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler-deploy.json
      - run: npx wrangler deploy --config .wrangler-deploy.json
      - run: npm run deploy:smoke
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
